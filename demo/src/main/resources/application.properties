spring.application.name=TubesRPL

# ---------------------------------------------------------------------
# DATABASE (PostgreSQL) - BELUM DIPAKAI
# Data pada frontend saat ini masih dummy (js/data.js).
# Dependency JDBC + driver PostgreSQL sudah ada di build.gradle.kts,
# jadi aplikasi tetap bisa jalan walaupun PostgreSQL belum dipasang:
# "initialization-fail-timeout=-1" membuat koneksi database tidak
# dicek saat aplikasi start.
#
# Saat database sudah siap: ubah url/username/password di bawah,
# lalu (opsional) hapus baris initialization-fail-timeout.
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/tubesrpl
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.hikari.initialization-fail-timeout=-1
